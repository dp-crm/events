<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback — Wealth Matrix</title>
<meta name="theme-color" content="#10213A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9EDF1;
    --surface:#FFFFFF;
    --ink:#10213A;
    --ink-soft:#4C5A6E;
    --line:#D7DCE3;
    --gold:#B8863B;
    --green:#2F6F4E;
    --red:#B0402F;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0B1420;
      --surface:#141F2E;
      --ink:#EDEFF2;
      --ink-soft:#9AA7B8;
      --line:#283A50;
      --gold:#D2A05C;
      --green:#4CAF7D;
      --red:#E28173;
    }
  }
  html{ overscroll-behavior-y:none; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px calc(64px + env(safe-area-inset-bottom,0px));
    padding-top:calc(40px + env(safe-area-inset-top,0px));
    overscroll-behavior-y:none;
    line-height:1.5;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(16,33,58,.04), 0 12px 32px -16px rgba(16,33,58,.18);
    overflow:hidden;
  }
  .card-top{ padding:32px 28px 20px; }
  .wordmark{ font-size:.8rem; font-weight:500; color:var(--ink-soft); margin:0 0 18px; }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.6rem;
    line-height:1.25;
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  .subline{ color:var(--ink-soft); font-size:.9rem; margin:0; }

  .card-bottom{ padding:6px 28px 32px; }
  .form-label{ display:block; font-size:.86rem; color:var(--ink-soft); margin:16px 0 6px; }
  .field{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:var(--surface);
  }
  textarea.field{ resize:vertical; min-height:100px; }
  .field:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; min-width:0; }

  button.submit{
    width:100%;
    margin-top:24px;
    padding:13px 16px;
    border:none;
    border-radius:9px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:.98rem;
    font-weight:600;
    cursor:pointer;
  }
  button.submit:disabled{ opacity:.55; cursor:default; }
  button.submit:hover:not(:disabled){ background:#183050; }
  button.submit{ transition:transform .1s ease, filter .1s ease; }
  button.submit:active:not(:disabled){ transform:scale(.98); filter:brightness(.95); }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }

  .error-msg{ margin-top:12px; font-size:.87rem; color:var(--red); display:none; }

  .success{ display:none; padding:40px 28px 44px; text-align:left; }
  .success .tick{
    width:44px; height:44px; border-radius:50%;
    background:#E7F1EB; color:var(--green);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
  }
  .success h2{ font-family:'Fraunces',serif; font-weight:600; font-size:1.4rem; margin:0 0 8px; }
  .success p{ color:var(--ink-soft); font-size:.94rem; margin:0; }

  .loading{ padding:48px 28px; text-align:center; color:var(--ink-soft); font-size:.92rem; }

  footer{ text-align:center; font-size:.78rem; color:var(--ink-soft); margin-top:22px; }
</style>
</head>
<body>

<div style="width:100%;max-width:440px;">
  <div class="card">

    <div id="loadingState" class="loading">Loading…</div>

    <form id="fbForm" style="display:none;">
      <div class="card-top">
        <p class="wordmark" id="firmName"></p>
        <h1 id="fbHeadline">Share your feedback</h1>
        <p class="subline" id="fbSubline"></p>
      </div>

      <div class="card-bottom">
        <label class="form-label" for="name">Full name</label>
        <input class="field" id="name" required autocomplete="name">

        <div class="row-2">
          <div>
            <label class="form-label" for="email">Email address</label>
            <input class="field" id="email" type="email" autocomplete="email">
          </div>
          <div>
            <label class="form-label" for="mobile">Mobile number</label>
            <input class="field" id="mobile" type="tel" autocomplete="tel">
          </div>
        </div>

        <label class="form-label" for="comment">Your feedback</label>
        <textarea class="field" id="comment" required placeholder="What worked, what didn't, anything you'd like covered next time…"></textarea>

        <button type="submit" class="submit" id="submitBtn">Send feedback</button>
        <p class="error-msg" id="errorMsg"></p>
      </div>
    </form>

    <div id="successState" class="success">
      <div class="tick">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <h2>Thank you</h2>
      <p>Your feedback has been received — we appreciate you taking the time.</p>
    </div>

  </div>
  <footer>Wealth Matrix</footer>
</div>

<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const eventId = params.get('id');

  async function loadEvent(){
    $('firmName').textContent = FIRM_NAME;
    if ($('name')) $('name').value = params.get('name') || '';
    if ($('email')) $('email').value = params.get('email') || '';
    if ($('mobile')) $('mobile').value = params.get('mobile') || '';

    if (eventId) {
      try {
        const res = await fetch(WEB_APP_URL + '?action=getEvent&id=' + encodeURIComponent(eventId));
        const data = await res.json();
        if (!data.error) {
          $('fbHeadline').textContent = 'How was ' + data.topic + '?';
          $('fbSubline').textContent = data.dateDisplay;
          document.title = 'Feedback — ' + data.topic;
        }
      } catch (err) { /* fall back to the generic heading */ }
    }

    $('loadingState').style.display = 'none';
    $('fbForm').style.display = 'block';
  }

  $('fbForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    $('errorMsg').style.display = 'none';

    const payload = {
      action: 'submitFeedback',
      id: eventId,
      name: $('name').value.trim(),
      email: $('email').value.trim(),
      mobile: $('mobile').value.trim(),
      comment: $('comment').value.trim()
    };

    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      $('fbForm').style.display = 'none';
      $('successState').style.display = 'block';
    } catch (err) {
      $('errorMsg').textContent = err.message || 'Something went wrong. Please try again.';
      $('errorMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send feedback';
    }
  });

  loadEvent();
</script>
</body>
</html>
